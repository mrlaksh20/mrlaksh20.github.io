<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Standard Meta Tags -->
    <title>Custom Preview Title</title>
    <meta name="description" content="This is a custom description designed to test link preview unfurling mechanisms.">
    
    <!-- Open Graph (OG) Tags for Link Unfurling -->
    <meta property="og:title" content="Custom Preview Title">
    <meta property="og:description" content="This is a custom description designed to test link preview unfurling mechanisms.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com">
    
    <!-- Favicon Link -->
    <link rel="icon" type="image/x-icon" href="https://example.comfavicon.ico">
</head>
<body>
    <h1>Test Environment Landing Page</h1>
    <p>This page serves as a valid metadata target for iframe testing and URL unfurl debugging.</p>
</body>
</html>
